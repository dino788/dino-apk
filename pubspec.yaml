name: Build Dino Allach APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Project & Keep Dino Code
        run: |
          if [ -f "lib/main.dart" ]; then cp lib/main.dart /tmp/main.dart; elif [ -f "main.dart" ]; then cp main.dart /tmp/main.dart; fi
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --org com.dinoallach --project-name dino_allach_tv .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="dino allach"/g' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk dino_allach.apk

      - name: Upload dino_allach.apk
        uses: actions/upload-artifact@v4
        with:
          name: dino_allach_apk
          path: dino_allach.apk
