            Widget _tvButton({
              required VoidCallback onTap,
              required Widget child,
              Color bgColor = const Color(0xFF1B2032),
              EdgeInsets padding = const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
              double radius = 6,
              bool isSelected = false,
              bool autofocus = false,
            }) {
              return Focus(
                autofocus: autofocus,
                onKeyEvent: (node, event) {
                  if (event is KeyDownEvent &&
                      (event.logicalKey == LogicalKeyboardKey.select ||
                       event.logicalKey == LogicalKeyboardKey.enter ||
                       event.logicalKey == LogicalKeyboardKey.numpadEnter ||
                       event.logicalKey == LogicalKeyboardKey.gameButtonA)) {
                    onTap();
                    return KeyEventResult.handled;
                  }
                  return KeyEventResult.ignored;
                },
                child: Builder(
                  builder: (ctx) {
                    final bool focused = Focus.of(ctx).hasPrimaryFocus;
                    return GestureDetector(
                      onTap: onTap,
                      child: AnimatedContainer(
                        duration: const Duration(milliseconds: 100),
                        padding: padding,
                        decoration: BoxDecoration(
                          color: focused
                              ? const Color(0xFFE50914)
                              : (isSelected ? const Color(0xFFF5C518) : bgColor),
                          borderRadius: BorderRadius.circular(radius),
                          border: Border.all(
                            color: focused
                                ? const Color(0xFFF5C518)
                                : (isSelected ? Colors.white : Colors.white12),
                            width: focused ? 2.2 : 1.0,
                          ),
                          boxShadow: focused
                              ? [const BoxShadow(color: Color(0x88F5C518), blurRadius: 6, spreadRadius: 1)]
                              : null,
                        ),
                        child: child,
                      ),
                    );
                  },
                ),
              );
            }

            @override
            void dispose() {
              _watchdogTimer?.cancel();
              _videoController?.dispose();
              _chewieController?.dispose();
              super.dispose();
            }

