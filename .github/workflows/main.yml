name: Build Dino Allach APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Dino Allach APK
        run: |
          mkdir -p /tmp/dino_app
          if [ -f "lib/main.dart" ]; then cp lib/main.dart /tmp/dino_main.dart; elif [ -f "main.dart" ]; then cp main.dart /tmp/dino_main.dart; fi
          mkdir -p $HOME/.gradle/init.d
          printf "allprojects {\n  tasks.configureEach { t ->\n    if (t.name.contains('lintVital')) { t.enabled = false }\n  }\n}\n" > $HOME/.gradle/init.d/nolint.gradle
          cd /tmp/dino_app
          flutter create --org com.dinoallach --project-name dino_allach_tv --platforms android .
          flutter pub add http shared_preferences video_player chewie
          if [ -f "/tmp/dino_main.dart" ]; then cp /tmp/dino_main.dart lib/main.dart; fi
          rm -rf test
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="dino allach"/g' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/dino_allach.apk

      - name: Upload dino_allach.apk
        uses: actions/upload-artifact@v4
        with:
          name: dino_allach_apk
          path: /tmp/dino_allach.apk
